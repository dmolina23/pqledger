name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test
        run: make test

  cbom-schema:
    # Generates a CBOM from the examples and validates it against the official
    # CycloneDX 1.6 JSON schema, so the output format cannot silently regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema referencing
      - run: make cbom
